# Build of the bridge (the resident PC app). The app is built only by this workflow
name: bridge

on:
  push:
    # Also list branches: with tags alone, pushes to branches would no longer trigger the workflow
    branches: ['**']
    # Pushing a tag starting with v (e.g. v0.1.0) puts the built app on a GitHub Release (the release job).
    # paths are not evaluated for tag pushes, so pushing a tag always runs it
    tags: ['v*']
    paths: ['src/bridge/**', 'src/ui/src/features/sync/protocol.ts', '.github/workflows/bridge.yml']
  pull_request:
    paths: ['src/bridge/**', 'src/ui/src/features/sync/protocol.ts', '.github/workflows/bridge.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: src/bridge

env:
  # Canvas page (HTTPS), set by the repository variable BRIDGE_CANVAS_URL.
  # If unset, the app opens the Vite dev server on the same PC (http://127.0.0.1:5173/)
  BRIDGE_CANVAS_URL: ${{ vars.BRIDGE_CANVAS_URL }}

jobs:
  # Checks dependency crates (advisories such as vulnerabilities, licenses, unused crates, sources). Config: src/bridge/deny.toml.
  # Reads Cargo.lock only and does not build the app. The official Action runs in Docker, so it runs on a Linux runner
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src/bridge/Cargo.toml
          # Add --locked (do not let it rewrite Cargo.lock) to the Action's default (--all-features)
          arguments: --all-features --locked
          # Use stable, the same as the build job, instead of the Rust in the Action's image (1.85)
          rust-version: stable

  build:
    # Do not build the app unless the checks pass
    needs: deny
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      # Cache the build of the dependency crates (~/.cargo and target) to speed up builds from the second run.
      # The cache key includes the OS, job, Cargo.lock and rustc version, so it is rebuilt when any of them changes
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/bridge
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      # macOS: package as an .app that stays in the menu bar
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          app="target/Draw MCP Connector.app"
          # version from Cargo.toml (after the trailing # or @ of cargo pkgid)
          version=$(cargo pkgid | sed 's/.*[#@]//')
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          # App icon: src/app_icon.rs writes PNGs and iconutil combines them into .icns
          cargo test --target ${{ matrix.target }} app_icon::tests::write_iconset -- --ignored
          iconutil -c icns target/AppIcon.iconset -o "$app/Contents/Resources/AppIcon.icns"
          cp "target/${{ matrix.target }}/release/draw-mcp-connector" "$app/Contents/MacOS/draw-mcp-connector"
          # License of the app (MIT) and the source and license of the bundled glyph data (KanjiVG, CC BY-SA 3.0)
          cp ../../LICENSE "$app/Contents/Resources/LICENSE"
          cp assets/kanjivg/README.md "$app/Contents/Resources/KanjiVG-LICENSE.md"
          # Licenses of the bundled crates (copyright and permission notices required by MIT, etc.)
          python3 -I tools/third_party_licenses.py ${{ matrix.target }} "$app/Contents/Resources/THIRD-PARTY-LICENSES.txt"
          sed "s/__VERSION__/$version/g" macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          # Ad-hoc signature without a certificate. Seals the whole .app, including Info.plist
          codesign --force --sign - "$app"
          codesign --verify --strict --verbose=2 "$app"
          # upload-artifact's zip drops the executable bit, so zip with ditto and upload it as is.
          # The file name becomes the name attached to the Release. The build is for Apple Silicon only, so the name says so.
          # No version in the name (the canvas page's releases/latest/download/<name> link would change with every version)
          ditto -c -k --keepParent "$app" target/Draw-MCP-Connector-macOS-AppleSilicon.zip
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          path: src/bridge/target/Draw-MCP-Connector-macOS-AppleSilicon.zip
          archive: false
          if-no-files-found: error

      # Rename to the name attached to the Release (no version in it, for the same reason as macOS)
      - if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/draw-mcp-connector.exe target/Draw-MCP-Connector-Windows-x64.exe
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: src/bridge/target/Draw-MCP-Connector-Windows-x64.exe
          archive: false
          if-no-files-found: error

  # Only on a tag (v*) push, put the build artifacts on a Release. The release notes are generated from the changes since the previous tag
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Stop if the tag differs from the version in Cargo.toml (the version shown in the app)
      - run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
            exit 1
          fi
      # The artifacts are uploaded unzipped (archive: false), so download them with v8.
      # The macOS artifact is the zip made by ditto itself, and v8 unzips zips by default (giving an .app folder
      # and dropping the executable bit). skip-decompress downloads the files exactly as uploaded
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true
      - run: gh release create "$GITHUB_REF_NAME" ../../dist/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
