[package]
name = "bridge"
version = "0.1.0"
edition = "2024"
# The app is MIT. The bundled glyph data (assets/kanjivg/glyphs.bin) is CC BY-SA 3.0
license = "MIT AND CC-BY-SA-3.0"

# The user-facing name is Draw MCP Connector. The package name (bridge) is the internal name
[[bin]]
name = "draw-mcp-connector"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
getrandom = "0.4.3"
open = "5.4.5"
# Encodes the canvas image passed to AI agents as PNG
png = "0.18.1"
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
wtransport = "0.7.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tao = "0.37.2"
tray-icon = "0.26.1"
# Draws pixels in the QR code window. The default features are only Linux render targets, so they are disabled
softbuffer = { version = "0.4.8", default-features = false }
